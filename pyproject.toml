[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kingai-tunerpro-map-editor"
version = "1.1.0"
description = "Offline XDF/BIN inspection and bounded integer edits with audit logs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jason King"}]
dependencies = [
  "kingai-tunerpro-xdf @ git+https://github.com/KingAiCodeForge/TunerPro-XDF-BIN-Universal-Exporter.git@f81e0cd6b522b8142e7424774ec068c9bb711792",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
kingai-map-editor = "cli_map_editor:main"

[tool.setuptools]
py-modules = ["cli_map_editor", "tunerpro_exporter_for_cli_editor_version", "raw_patch_manifest", "raw_patch_checksum_profiles", "porting_templates"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = ["ignore", "build", "dist", ".venv", ".git", ".test-runs", "dist-verify"]
