name: Editor package and exporter contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install with pinned exporter
        shell: pwsh
        run: |
          python -m pip install build pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-Item dist/kingai_tunerpro_map_editor-1.1.0-*.whl
          python -m pip install $wheel.FullName
          exit $LASTEXITCODE
      - name: Test installed packages away from source
        shell: pwsh
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'editor-tests'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          Copy-Item -Path test_*.py -Destination $testRoot
          Set-Location $testRoot
          python -I -m pytest --import-mode=importlib -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kingai-map-editor --help
          exit $LASTEXITCODE
